[project]
name = "agentrail-core"
version = "0.1.0"
description = "Shared AgentRail platform primitives: settings, logging, correlation, storage clients"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic==2.10.5",
    "pydantic-settings==2.7.1",
    "psycopg[binary]==3.2.3",
    "redis==5.2.1",
    "sqlalchemy[asyncio]==2.0.37",
    "starlette==0.41.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentrail_core"]
