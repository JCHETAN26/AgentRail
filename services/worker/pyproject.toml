[project]
name = "agentrail-worker"
version = "0.1.0"
description = "AgentRail job worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agentrail-core",
    "fastapi==0.115.6",
    "httpx==0.28.1",
    "uvicorn[standard]==0.51.0",
]

[project.scripts]
agentrail-worker = "agentrail_worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentrail_worker"]
