[project]
name = "agentrail-api"
version = "0.1.0"
description = "AgentRail platform API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agentrail-core",
    "alembic==1.18.5",
    # EmailStr in the identity contracts requires this at runtime.
    "email-validator==2.2.0",
    "fastapi==0.140.13",
    "httpx==0.28.1",
    "uvicorn[standard]==0.51.0",
]

[project.scripts]
agentrail-api = "agentrail_api.main:main"
agentrail-seed = "agentrail_api.seed:main"

[dependency-groups]
dev = [
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentrail_api"]
