[alembic]
# %(here)s makes the paths independent of the working directory, so migrations
# can be driven from the repository root (where .env lives) as well as from
# services/api.
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/src
version_path_separator = os
# sqlalchemy.url is supplied at runtime from AGENTRAIL_DATABASE_URL (see alembic/env.py).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
