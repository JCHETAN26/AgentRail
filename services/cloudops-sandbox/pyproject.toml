[project]
name = "agentrail-cloudops-sandbox"
version = "0.1.0"
description = "Deterministic synthetic CloudOps environment used as AgentRail's reference workload"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agentrail-core",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
]

[project.scripts]
agentrail-cloudops-sandbox = "agentrail_cloudops_sandbox.main:main"

[dependency-groups]
dev = [
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentrail_cloudops_sandbox"]
