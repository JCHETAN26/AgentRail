apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentrail.name" . }}-api
  labels:
    {{- include "agentrail.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: {{ include "agentrail.name" . }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentrail.name" . }}-worker
  labels:
    {{- include "agentrail.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  selector:
    app.kubernetes.io/name: {{ include "agentrail.name" . }}
    app.kubernetes.io/component: worker
  ports:
    - name: health
      port: {{ .Values.worker.healthPort }}
      targetPort: health
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentrail.name" . }}-sandbox
  labels:
    {{- include "agentrail.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox
spec:
  selector:
    app.kubernetes.io/name: {{ include "agentrail.name" . }}
    app.kubernetes.io/component: sandbox
  ports:
    - name: http
      port: {{ .Values.sandbox.port }}
      targetPort: http
