apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentrail.name" . }}-api
  labels:
    {{- include "agentrail.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "agentrail.name" . }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "agentrail.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: api
          image: {{ include "agentrail.image" (merge (dict "service" "agentrail-api") .) }}
          imagePullPolicy: {{ .Values.global.pullPolicy }}
          command: ["agentrail-api"]
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          envFrom:
            - configMapRef:
                name: {{ include "agentrail.name" . }}-config
            - secretRef:
                name: {{ include "agentrail.name" . }}-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "agentrail.securityContext" . | nindent 12 }}
