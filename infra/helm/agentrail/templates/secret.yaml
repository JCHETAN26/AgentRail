apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentrail.name" . }}-secrets
  labels:
    {{- include "agentrail.labels" . | nindent 4 }}
type: Opaque
stringData:
  AGENTRAIL_DATABASE_URL: {{ required "secrets.databaseUrl is required" .Values.secrets.databaseUrl | quote }}
  AGENTRAIL_REDIS_URL: {{ required "secrets.redisUrl is required" .Values.secrets.redisUrl | quote }}
  AGENTRAIL_MINIO_ENDPOINT: {{ .Values.secrets.minioEndpoint | quote }}
  AGENTRAIL_MINIO_ACCESS_KEY: {{ .Values.secrets.minioAccessKey | quote }}
  AGENTRAIL_MINIO_SECRET_KEY: {{ .Values.secrets.minioSecretKey | quote }}
