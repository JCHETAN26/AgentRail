name: dependency-review

# Blocks a pull request that introduces a dependency with a known vulnerability
# or an unacceptable licence.

on: pull_request

permissions:
  contents: read

jobs:
  review:
    name: dependency-review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          # Copyleft licences would complicate distribution of this project.
          deny-licenses: AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later, GPL-3.0, GPL-3.0-only
          comment-summary-in-pr: on-failure
