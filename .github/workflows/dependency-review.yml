name: dependency-review

# Blocks a pull request that introduces a dependency with a known vulnerability
# or an unacceptable licence.

on: pull_request

permissions:
  contents: read

jobs:
  review:
    name: dependency-review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7

      - name: Check dependency graph availability
        id: dependency-graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(gh api "repos/${{ github.repository }}" --jq '.security_and_analysis.dependency_graph.status // "unknown"' 2>/dev/null || echo unknown)"
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          if [ "${status}" != "enabled" ]; then
            echo "::warning::Dependency graph is ${status}; skipping dependency review until it is enabled in repository settings."
          fi

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # actions/dependency-review-action@v5.0.0
        if: steps.dependency-graph.outputs.status == 'enabled'
        with:
          fail-on-severity: moderate
          # Copyleft licences would complicate distribution of this project.
          deny-licenses: AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later, GPL-3.0, GPL-3.0-only
          comment-summary-in-pr: on-failure
