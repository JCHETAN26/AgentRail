name: ci

# Every job here is deterministic and requires no model-provider credentials.
# Job names are stable because they are referenced by branch protection
# (see docs/BRANCH_PROTECTION.md) — renaming one is a breaking change.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22.12.0'
  PYTHON_VERSION: '3.12'
  UV_VERSION: '0.11.8'

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Build
        run: pnpm --filter @agentrail/web build

  python:
    name: python
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --frozen

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: |
          uv run mypy packages/core-py/src services/api/src \
            services/worker/src services/cloudops-sandbox/src

      - name: GitHub Actions are pinned
        run: uv run python scripts/check_github_actions_pinned.py

      - name: Unit tests
        # Integration tests are deselected here; the `integration` job owns them.
        run: uv run pytest -m "not integration" --cov --cov-report=term-missing

  contracts:
    name: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --all-packages --frozen
          pnpm install --frozen-lockfile

      - name: OpenAPI snapshot is current
        run: uv run python scripts/export_openapi.py --check

      - name: Generated TypeScript client is current
        run: pnpm --filter @agentrail/contracts check

  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: agentrail
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: agentrail
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agentrail -d agentrail"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # A missing dependency fails the suite instead of silently skipping it.
      AGENTRAIL_REQUIRE_INTEGRATION: '1'
      AGENTRAIL_ENVIRONMENT: ci
      AGENTRAIL_DATABASE_URL: postgresql+psycopg://agentrail:ci_only_password@localhost:5432/agentrail
      AGENTRAIL_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --frozen

      - name: Apply migrations
        run: uv run alembic -c services/api/alembic.ini upgrade head

      - name: Migrations are reversible
        run: |
          uv run alembic -c services/api/alembic.ini downgrade base
          uv run alembic -c services/api/alembic.ini upgrade head

      - name: Integration tests
        run: uv run pytest -m integration

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start the full stack
        run: |
          docker compose -f infra/compose/docker-compose.yml --profile apps up -d --build --wait

      - name: Install Playwright browser
        run: pnpm --filter @agentrail/web exec playwright install --with-deps chromium

      - name: Build the web app
        run: pnpm --filter @agentrail/web build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000

      - name: Run end-to-end tests
        run: pnpm --filter @agentrail/web e2e
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          AGENTRAIL_WEB_PORT: '3737'

      - name: Collect service logs on failure
        if: failure()
        run: docker compose -f infra/compose/docker-compose.yml --profile apps logs --no-color

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  containers:
    name: containers / scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [agentrail-api, agentrail-worker, agentrail-cloudops-sandbox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7

      - name: Dockerfile uses pinned runtime inputs
        run: |
          python - <<'PY'
          from pathlib import Path

          dockerfile = Path("infra/compose/Dockerfile.python").read_text()
          forbidden = ("FROM python:latest", "FROM ghcr.io/astral-sh/uv:latest")
          for marker in forbidden:
              if marker in dockerfile:
                  raise SystemExit(f"unversioned base image is forbidden: {marker}")
          required = ("FROM python:3.12.8-slim-bookworm", "FROM ghcr.io/astral-sh/uv:0.11.32")
          for marker in required:
              if marker not in dockerfile:
                  raise SystemExit(f"expected pinned base image is missing: {marker}")
          PY

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # docker/build-push-action@v6
        with:
          context: .
          file: infra/compose/Dockerfile.python
          build-args: SERVICE_PACKAGE=${{ matrix.service }}
          push: false
          load: true
          tags: ${{ matrix.service }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image runs as a non-root user
        run: |
          user="$(docker run --rm --entrypoint id ${{ matrix.service }}:ci -u)"
          echo "uid=$user"
          test "$user" != "0"
